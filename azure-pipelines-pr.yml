trigger: none

pr:
  branches:
    include:
      - main

parameters:
- name: agentPool
  displayName: Build agent pool
  type: string
  default: microsoft-hosted
  values:
  - microsoft-hosted
  - self-hosted

stages:
- stage: WorkItems
  displayName: Update work items
  dependsOn: []
  condition: eq(variables['Build.Reason'], 'PullRequest')
  jobs:
  - template: templates/work-item-in-progress-job.yml
    parameters:
      pool:
        vmImage: ubuntu-latest

- stage: Changes
  displayName: Detect changes
  dependsOn: []
  jobs:
  - template: templates/detect-changes-job.yml
    parameters:
      pool:
        vmImage: ubuntu-latest

# The build stages run only when the pull request changes files their checks cover
# (templates/detect-changes-job.yml). A skipped stage does not fail the pull request.
- stage: Build
  displayName: Build solution
  dependsOn: Changes
  condition: and(succeeded(), eq(dependencies.Changes.outputs['DetectChanges.paths.backend'], 'true'))
  jobs:
  - ${{ if eq(parameters.agentPool, 'self-hosted') }}:
    - template: templates/dotnet-build-job.yml
      parameters:
        pool:
          name: Default
  - ${{ else }}:
    - template: templates/dotnet-build-job.yml
      parameters:
        pool:
          vmImage: ubuntu-latest

- stage: FrontendBuild
  displayName: Build frontend
  dependsOn: Changes
  condition: and(succeeded(), eq(dependencies.Changes.outputs['DetectChanges.paths.frontend'], 'true'))
  jobs:
  - ${{ if eq(parameters.agentPool, 'self-hosted') }}:
    - template: templates/frontend-build-job.yml
      parameters:
        pool:
          name: Default
  - ${{ else }}:
    - template: templates/frontend-build-job.yml
      parameters:
        pool:
          vmImage: ubuntu-latest