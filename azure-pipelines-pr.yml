trigger: none

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

stages:
- stage: Build
  displayName: Build solution
  jobs:
  - job: DotnetBuild
    displayName: Build .NET solution
    steps:
    - checkout: self

    - task: UseDotNet@2
      displayName: Install .NET SDK
      inputs:
        packageType: sdk
        version: 10.x

    - script: dotnet build src/MyCV.sln --configuration Release
      displayName: Build solution

    - script: dotnet tool install --global dotnet-ef --version 10.0.11
      displayName: Install EF Core CLI

    - script: dotnet ef migrations has-pending-model-changes --project src/CV.DataAccess/CV.DataAccess.csproj --startup-project src/CV.WebApi/CV.WebApi.csproj
      displayName: Check EF Core migrations