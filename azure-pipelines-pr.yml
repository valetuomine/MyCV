trigger: none

pr:
  branches:
    include:
      - main

parameters:
- name: agentPool
  displayName: Build agent pool
  type: string
  default: microsoft-hosted
  values:
  - microsoft-hosted
  - self-hosted

stages:
- stage: WorkItems
  displayName: Update work items
  dependsOn: []
  condition: eq(variables['Build.Reason'], 'PullRequest')
  jobs:
  - template: templates/work-item-in-progress-job.yml
    parameters:
      pool:
        vmImage: ubuntu-latest

- stage: Build
  displayName: Build solution
  dependsOn: []
  jobs:
  - ${{ if eq(parameters.agentPool, 'self-hosted') }}:
    - template: templates/dotnet-build-job.yml
      parameters:
        pool:
          name: Default
  - ${{ else }}:
    - template: templates/dotnet-build-job.yml
      parameters:
        pool:
          vmImage: ubuntu-latest

- stage: FrontendBuild
  displayName: Build frontend
  jobs:
  - ${{ if eq(parameters.agentPool, 'self-hosted') }}:
    - template: templates/frontend-build-job.yml
      parameters:
        pool:
          name: Default
  - ${{ else }}:
    - template: templates/frontend-build-job.yml
      parameters:
        pool:
          vmImage: ubuntu-latest