trigger: none

pr:
  branches:
    include:
      - main

parameters:
# auto: the frontend build runs on the self-hosted agent when one in the Default pool is online
# and idle (templates/pick-agent-job.yml), and on a Microsoft-hosted agent otherwise. The backend
# build always runs on a Microsoft-hosted agent, so the two builds use separate parallel jobs and
# run side by side. The other two values force the pool for both builds.
- name: agentPool
  displayName: Build agent pool
  type: string
  default: auto
  values:
  - auto
  - microsoft-hosted
  - self-hosted

stages:
- stage: WorkItems
  displayName: Update work items
  dependsOn: []
  condition: eq(variables['Build.Reason'], 'PullRequest')
  jobs:
  - template: templates/work-item-in-progress-job.yml
    parameters:
      pool:
        vmImage: ubuntu-latest

- stage: Changes
  displayName: Detect changes
  dependsOn: []
  jobs:
  - template: templates/detect-changes-job.yml
    parameters:
      pool:
        vmImage: ubuntu-latest
  - ${{ if eq(parameters.agentPool, 'auto') }}:
    - template: templates/pick-agent-job.yml
      parameters:
        pool:
          vmImage: ubuntu-latest

# The build stages run only when the pull request changes files their checks cover
# (templates/detect-changes-job.yml). A skipped stage does not fail the pull request.
- stage: Build
  displayName: Build solution
  dependsOn: Changes
  condition: and(succeeded(), eq(dependencies.Changes.outputs['DetectChanges.paths.backend'], 'true'))
  jobs:
  - ${{ if eq(parameters.agentPool, 'self-hosted') }}:
    - template: templates/dotnet-build-job.yml
      parameters:
        pool:
          name: Default
  - ${{ else }}:
    - template: templates/dotnet-build-job.yml
      parameters:
        pool:
          vmImage: ubuntu-latest

- stage: FrontendBuild
  displayName: Build frontend
  dependsOn: Changes
  condition: and(succeeded(), eq(dependencies.Changes.outputs['DetectChanges.paths.frontend'], 'true'))
  jobs:
  - template: templates/frontend-build-jobs.yml
    parameters:
      agentPool: ${{ parameters.agentPool }}

- stage: MarkdownLint
  displayName: Lint Markdown
  dependsOn: Changes
  condition: and(succeeded(), eq(dependencies.Changes.outputs['DetectChanges.paths.markdown'], 'true'))
  jobs:
  - template: templates/markdown-lint-job.yml
    parameters:
      pool:
        vmImage: ubuntu-latest
