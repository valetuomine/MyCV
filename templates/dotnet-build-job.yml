parameters:
- name: pool
  type: object

jobs:
- job: DotnetBuild
  displayName: Build .NET solution
  pool: ${{ parameters.pool }}
  steps:
  - checkout: self

  - task: UseDotNet@2
    displayName: Install .NET SDK
    inputs:
      packageType: sdk
      version: 10.x

  - script: dotnet build src/MyCV.sln --configuration Release
    displayName: Build solution

  - script: dotnet tool install --global dotnet-ef --version 10.0.11
    displayName: Install EF Core CLI

  - script: dotnet ef migrations has-pending-model-changes --project src/Backend/CV.DataAccess/CV.DataAccess.csproj --startup-project src/Backend/CV.WebApi/CV.WebApi.csproj
    displayName: Check EF Core migrations
