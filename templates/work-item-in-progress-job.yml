parameters:
- name: pool
  type: object

jobs:
- job: MarkWorkItemsInProgress
  displayName: Move linked work items to In Progress
  pool: ${{ parameters.pool }}
  steps:
  - checkout: none

  # Moves the work items linked to this pull request to "In Progress" while the pull request
  # is open: New or "Ready for Development" User Stories and Tasks, "On Hold" User Stories,
  # "Waiting for Predecessor" User Stories and Tasks (a linked pull request means the work
  # has started), and User Stories that are already "Waiting for Deployment" from an earlier
  # pull request.
  # The move also rewrites the first description line, "Tila: In Progress: <reason>", in the
  # same PATCH call as the state.
  # After the merge, the main pipeline moves them forward again
  # (templates/work-item-state-job.yml). Closed and Removed items are left as
  # they are.
  - bash: |
      set -euo pipefail

      api="${COLLECTION_URI}${TEAM_PROJECT}/_apis"
      auth="Authorization: Bearer ${SYSTEM_ACCESSTOKEN}"

      # Builds the JSON Patch that sets the state and rewrites the first description line,
      # "Tila: <state>: <reason>". A Tila line at the very start of the description (Azure
      # DevOps adds spaces when it saves HTML, so whitespace is allowed) and its blank line
      # are dropped and the new ones are put first; an empty description gets the line alone.
      # The "test" operation on the revision makes the PATCH fail if the work item changed
      # after it was read, so a concurrent edit of the description is never overwritten.
      tila_patch() {
        jq -cn --arg state "$1" --arg reason "$2" --arg desc "$3" --argjson rev "$4" '
          "<div><b>Tila:</b> \($state): \($reason)</div>" as $line
          | ($desc | sub("^\\s*<div>\\s*<b>\\s*Tila:\\s*</b>[^<]*</div>\\s*(<div>\\s*<br\\s*/?>\\s*</div>)?\\s*"; "")) as $rest
          | [{op: "test", path: "/rev", value: $rev},
             {op: "add", path: "/fields/System.State", value: $state},
             {op: "add", path: "/fields/System.Description",
              value: (if $rest == "" then $line else $line + "<div><br></div>" + $rest end)}]'
      }

      # Sets the state and the Tila line in one PATCH. If that PATCH fails (for example because
      # the description changed meanwhile), it logs the server's answer as a warning and sets
      # the state alone, so the move is never blocked by the description.
      # Arguments: work item id, new state, reason, current description, current revision.
      set_state() {
        local patch out
        patch=$(tila_patch "$2" "$3" "$4" "$5") || patch=""
        if [ -n "$patch" ] && out=$(curl -sS --fail-with-body -X PATCH -H "$auth" \
          -H "Content-Type: application/json-patch+json" \
          "$api/wit/workitems/$1?api-version=7.1" -d "$patch" 2>&1); then
          return 0
        fi
        echo "##vso[task.logissue type=warning]PATCH with the Tila line failed for #$1, setting the state alone: ${out:-no answer}"
        curl -sS --fail-with-body -X PATCH -H "$auth" -H "Content-Type: application/json-patch+json" \
          "$api/wit/workitems/$1?api-version=7.1" \
          -d "[{\"op\":\"add\",\"path\":\"/fields/System.State\",\"value\":\"$2\"}]" > /dev/null
      }

      work_item_ids=$(curl -sS --fail-with-body -H "$auth" \
        "$api/git/repositories/$REPOSITORY_ID/pullRequests/$PULL_REQUEST_ID/workitems?api-version=7.1" \
        | jq -r '.value[].id')

      if [ -z "$work_item_ids" ]; then
        echo "Pull request $PULL_REQUEST_ID has no linked work items."
        exit 0
      fi

      ids_csv=$(echo "$work_item_ids" | paste -sd, -)
      items=$(curl -sS --fail-with-body -H "$auth" \
        "$api/wit/workitems?ids=$ids_csv&fields=System.State,System.WorkItemType,System.Description&api-version=7.1")

      echo "$items" | jq -r '.value[] | "\(.id)\t\(.fields["System.WorkItemType"])\t\(.fields["System.State"])"' \
        | while IFS=$'\t' read -r id type state; do
            move=false
            case "$type:$state" in
              "User Story:New" | "User Story:Ready for Development" | "User Story:On Hold" | "User Story:Waiting for Predecessor" | "User Story:Waiting for Deployment" | "Task:New" | "Task:Ready for Development" | "Task:Waiting for Predecessor")
                move=true
                ;;
            esac

            if [ "$move" = false ]; then
              echo "#$id ($type) stays in state '$state'."
              continue
            fi

            description=$(echo "$items" | jq -r --argjson id "$id" '.value[] | select(.id == $id) | .fields["System.Description"] // ""')
            rev=$(echo "$items" | jq -r --argjson id "$id" '.value[] | select(.id == $id) | .rev')
            set_state "$id" "In Progress" "Pull request $PULL_REQUEST_ID on auki." "$description" "$rev"
            echo "#$id ($type) moved from '$state' to 'In Progress'."
          done
    displayName: Move linked work items to In Progress
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      COLLECTION_URI: $(System.CollectionUri)
      TEAM_PROJECT: $(System.TeamProject)
      REPOSITORY_ID: $(Build.Repository.ID)
      PULL_REQUEST_ID: $(System.PullRequest.PullRequestId)
