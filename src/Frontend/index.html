<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/mycv-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafa" />
    <meta
      name="description"
      content="MyCV shows a developer's CV at its own link: title, summary, location and profile links."
    />
    <script>
      // Apply the saved or OS theme before first paint to avoid a flash.
      try {
        var saved = JSON.parse(localStorage.getItem("cv-theme"));
        var dark =
          saved === "dark" ||
          (saved !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", dark ? "#09090b" : "#fafafa");
      } catch (e) {}
    </script>
    <title>MyCV</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
