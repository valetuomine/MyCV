trigger:
  branches:
    include:
      - main

pr: none

parameters:
- name: agentPool
  displayName: Build agent pool
  type: string
  default: microsoft-hosted
  values:
  - microsoft-hosted
  - self-hosted

stages:
- stage: Changes
  displayName: Detect changes
  jobs:
  - template: templates/detect-changes-job.yml
    parameters:
      pool:
        vmImage: ubuntu-latest

# The build stages run only when the merged pull request changes files their checks cover
# (templates/detect-changes-job.yml). The stages after them accept a skipped build, but not
# a failed or canceled one.
- stage: Build
  displayName: Build solution
  dependsOn: Changes
  condition: and(succeeded(), eq(dependencies.Changes.outputs['DetectChanges.paths.backend'], 'true'))
  jobs:
  - ${{ if eq(parameters.agentPool, 'self-hosted') }}:
    - template: templates/dotnet-build-job.yml
      parameters:
        pool:
          name: Default
  - ${{ else }}:
    - template: templates/dotnet-build-job.yml
      parameters:
        pool:
          vmImage: ubuntu-latest

- stage: FrontendBuild
  displayName: Build frontend
  dependsOn: Changes
  condition: and(succeeded(), eq(dependencies.Changes.outputs['DetectChanges.paths.frontend'], 'true'))
  jobs:
  - ${{ if eq(parameters.agentPool, 'self-hosted') }}:
    - template: templates/frontend-build-job.yml
      parameters:
        pool:
          name: Default
  - ${{ else }}:
    - template: templates/frontend-build-job.yml
      parameters:
        pool:
          vmImage: ubuntu-latest

- stage: WorkItems
  displayName: Update work items
  dependsOn:
  - Changes
  - Build
  - FrontendBuild
  condition: |
    and(
      eq(dependencies.Changes.result, 'Succeeded'),
      in(dependencies.Build.result, 'Succeeded', 'Skipped'),
      in(dependencies.FrontendBuild.result, 'Succeeded', 'Skipped')
    )
  jobs:
  - template: templates/work-item-state-job.yml
    parameters:
      pool:
        vmImage: ubuntu-latest

- stage: GitHubSync
  displayName: Sync main to GitHub
  dependsOn:
  - Changes
  - Build
  - FrontendBuild
  condition: |
    and(
      eq(dependencies.Changes.result, 'Succeeded'),
      in(dependencies.Build.result, 'Succeeded', 'Skipped'),
      in(dependencies.FrontendBuild.result, 'Succeeded', 'Skipped')
    )
  jobs:
  - job: PushToGitHub
    displayName: Push main to GitHub
    pool:
      vmImage: ubuntu-latest
    steps:
    # With the full history, the push sends every commit GitHub is missing. A shallow checkout
    # had only the newest merge commit, so after one missed sync GitHub lacked its parent and
    # rejected every later push.
    - checkout: self
      fetchDepth: 0

    - bash: |
        set -euo pipefail

        if [ -z "${GITHUB_TOKEN:-}" ]; then
          echo "GITHUB_TOKEN is not available. Add it as a secret pipeline variable."
          exit 1
        fi
        git config user.name "Valtteri Tuominen"
        git config user.email "valetuomine@users.noreply.github.com"
        github_auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w 0)
        github_url="https://github.com/valetuomine/MyCV.git"
        git_auth_config=( -c "http.extraheader=AUTHORIZATION: basic ${github_auth}" )

        github_main_sha=$(git "${git_auth_config[@]}" ls-remote "$github_url" refs/heads/main | awk '{print $1}')
        if [ -z "$github_main_sha" ]; then
          echo "GitHub main branch was not found."
          exit 1
        fi
        # A run that started later may already have pushed a newer main, and GitHub main is
        # never moved back.
        if git merge-base --is-ancestor HEAD "$github_main_sha" 2>/dev/null; then
          echo "GitHub main already contains $(git rev-parse --short HEAD). Nothing to push."
        else
          git "${git_auth_config[@]}" push \
            --force-with-lease="refs/heads/main:$github_main_sha" \
            "$github_url" HEAD:main
        fi

        github_heads=$(git "${git_auth_config[@]}" ls-remote --heads "$github_url")
        while read -r _ branch_ref; do
          branch=${branch_ref#refs/heads/}
          if [ "$branch" != "main" ]; then
            echo "Deleting GitHub branch: $branch"
            git "${git_auth_config[@]}" push "$github_url" ":refs/heads/$branch"
          fi
        done <<< "$github_heads"
      displayName: Sync main to GitHub
      env:
        GITHUB_TOKEN: $(GITHUB_TOKEN)